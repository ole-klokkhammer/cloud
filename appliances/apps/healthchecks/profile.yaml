name: healthchecks
description: healthchecks container profile
config:
  user.host: "core"
  limits.cpu: "1"
  limits.memory: 2GB
  security.nesting: "false"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic 
  config:
    path: /config
    shift: "true"
    source: /ssd/appdata/healthchecks  
    type: disk
  root:
    path: /
    pool: zpool
    type: disk
project: default
