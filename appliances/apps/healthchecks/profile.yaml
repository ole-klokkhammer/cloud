name: healthchecks
description: healthchecks container profile
config:
  user.host: "core"
  limits.cpu: "16"
  limits.memory: 192GB 
  security.nesting: "false"
  security.privileged: "false"
  nvidia.runtime: "true"
  nvidia.driver.capabilities: all
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic 
  config:
    path: /config
    shift: "true"
    source: /ssd/appdata/healthchecks  
    type: disk
  root:
    path: /
    pool: zpool
    type: disk
project: default
