name: matrix
description: matrix container profile
config:
  user.host: "core"
  limits.cpu: "4"
  limits.memory: 16GB 
  security.nesting: "false"
  security.privileged: "false" 
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:4a:43:18
  config:
    path: /etc/matrix-synapse
    shift: "true"
    source: /ssd/appdata/matrix/config
    type: disk
  media:
    path: /media
    shift: "true"
    source: /ssd/appdata/matrix/media
    type: disk
  root:
    path: /
    pool: zpool
    type: disk
project: default
