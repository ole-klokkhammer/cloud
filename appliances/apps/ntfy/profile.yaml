name: ntfy
description: ntfy container profile
config:
  user.host: "core"
  limits.cpu: "2"
  limits.memory: 2GB
  security.nesting: "false"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  root:
    path: /
    pool: zpool
    type: disk
project: default
