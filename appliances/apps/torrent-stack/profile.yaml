name: torrent-stack
description: Torrent stack profile
config:
  user.host: "core"
  limits.cpu: "4"
  limits.memory: 32GB
  security.nesting: "true"
  security.privileged: "true"
  linux.kernel_modules: ip_tables, ip6_tables, netlink_diag, nf_nat, overlay
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: "00:16:3e:e7:58:62"
  media:
    path: /hdd/media
    source: /hdd/media
    type: disk
    shift: "true"
  music:
    path: /hdd/music
    source: /hdd/music
    type: disk
    shift: "true"
  root:
    path: /
    pool: zpool
    type: disk
  docker:
    path: /docker
    source: /ssd/appdata/torrent-stack/docker
    type: disk
    shift: "true"
  config:
    path: /config
    source: /ssd/appdata/torrent-stack/config
    type: disk
    shift: "true" 
  lib-modules:
    path: /mnt/lib_modules
    source: /lib/modules
    type: disk
    readonly: "true"
project: default
