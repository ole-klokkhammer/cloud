name: vault-agent
description: vault-agent container profile
config:
  user.host: "core"
  limits.cpu: "1"
  limits.memory: 4GB
  linux.kernel_modules: overlay, nf_conntrack, ip_tables, netlink_diag
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
    lxc.mount.auto = cgroup:rw
  security.nesting: "true"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:86:eb:98
  vault-agent-config:
    path: /etc/vault.d
    shift: "true"
    source: /ssd/appdata/vault-agent/config
    type: disk
  secrets:
    path: /etc/secrets
    shift: "true"
    source: /ssd/secrets
    type: disk
  root:
    path: /
    pool: zpool
    type: disk 
project: default