name: gaming-vm
description: gaming VM profile
config:
  user.host: "core"
  user.autostart: "false" # informational; set boot.autostart on the instance
  limits.cpu: "12"
  limits.memory: 256GB
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  root:
    path: /
    pool: zpool
    type: disk
project: default
