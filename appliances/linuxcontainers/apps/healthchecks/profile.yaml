name: healthchecks
description: healthchecks container profile
config:
  user.host: "core"
  limits.cpu: "1"
  limits.memory: 2GB
  linux.kernel_modules: overlay, nf_conntrack, ip_tables, netlink_diag
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
    lxc.mount.auto = cgroup:rw
  security.nesting: "false"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic 
  config:
    path: /config
    shift: "true"
    source: /ssd/appdata/healthchecks  
    type: disk
  root:
    path: /
    pool: zpool
    type: disk
project: default
