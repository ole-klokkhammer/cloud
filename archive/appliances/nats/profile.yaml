name: nats
description: NATS container profile
config:
  user.host: "core"
  limits.cpu: "2"
  limits.memory: 16GB
  security.nesting: "true"
  security.privileged: "false"
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  root:
    path: /
    pool: zpool
    type: disk
project: default
