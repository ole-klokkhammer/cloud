name: hermes
description: A profile for running hermes
config:
  user.host: "core"
  limits.cpu: "4"
  limits.memory: 32GB
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  root:
    path: /
    pool: zpool
    type: disk
  hermes-data:
    path: /root/.hermes
    shift: "true"
    source: /ssd/appdata/hermes/data
    type: disk