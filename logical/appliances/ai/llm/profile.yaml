name: llm
description: A profile for running LLMs on a GPU worker with local models.
config:
  user.host: "core"
  limits.cpu: "16"
  limits.cpu.nodes: "0,1"
  limits.memory: 128GB
  limits.kernel.memlock: unlimited
  limits.memory.swap: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  gpu:
    type: gpu
    gputype: physical
    id: nvidia.com/gpu=1
  root:
    path: /
    pool: zpool
    type: disk
  models:
    path: /models
    shift: "true"
    source: /ssd/llm/models
    type: disk