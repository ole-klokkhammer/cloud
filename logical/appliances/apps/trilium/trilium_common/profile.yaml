name: trilium_common
description: trilium container profile
config:
  user.host: "core"
  limits.cpu: "2"
  limits.memory: 4GB
  linux.kernel_modules: overlay, nf_conntrack, ip_tables, netlink_diag
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
    lxc.mount.auto = cgroup:rw
  security.nesting: "false"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:41:e7:f8
  trilium-data:
    path: /root/.local/share/trilium-data
    shift: "true"
    source: /ssd/appdata/trilium-common/data
    type: disk
  config:
    path: /config
    shift: "true"
    source: /ssd/appdata/trilium-common/config
    type: disk
  root:
    path: /
    pool: zpool
    type: disk 
project: default
