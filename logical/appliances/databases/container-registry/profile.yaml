name: container-registry
description: container registry profile
config:
  user.host: "core"
  limits.cpu: "1"
  limits.memory: 2GB 
  security.nesting: "false"
  security.privileged: "false" 
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:7e:00:2a
  root:
    path: /
    pool: zpool
    type: disk
project: default
