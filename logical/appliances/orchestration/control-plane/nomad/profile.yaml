name: control-plane
description: Control Plane Server container profile
config:
  user.host: "core"
  limits.cpu: "2"
  limits.memory: 4GB
  security.nesting: "false"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:76:04:69
  nomad-data:
    path: /opt/nomad/data
    shift: "true"
    source: /ssd/appdata/control-plane/nomad
    type: disk
  # consul-data:
  #   path: /opt/consul
  #   shift: "true"
  #   source: /ssd/appdata/control-plane/consul
  #   type: disk
  root:
    path: /
    pool: zpool
    type: disk 
project: default