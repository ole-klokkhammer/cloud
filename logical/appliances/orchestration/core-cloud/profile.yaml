name: core-cloud
description: Cloud profile
config:
  limits.cpu: "8"
  limits.memory: 32GB
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
  security.nesting: "true"

devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:86:20:a7
  root:
    path: /
    pool: zpool
    type: disk
  env:
    path: /etc/containers/env
    shift: "true"
    source: /ssd/appdata/env
    type: disk
project: default
