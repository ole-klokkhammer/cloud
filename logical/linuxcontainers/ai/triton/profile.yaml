name: triton
description: A profile for running AI utilities on a GPU worker with local models.
config:
  user.host: "core"
  limits.cpu: "16"
  limits.cpu.nodes: "0,1,2,3"
  limits.memory: 64GB
  limits.memory.swap: "false"
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
  security.nesting: "true"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  gpu:
    type: gpu
    gputype: physical
    id: nvidia.com/gpu=0
  root:
    path: /
    pool: zpool
    type: disk
  models:
    path: /models
    shift: "true"
    source: /ssd/models/seldon
    type: disk
  env:
    path: /env/zot.env
    shift: "true"
    source: /ssd/appdata/env/zot.env
    type: disk
  models:
    path: /models
    shift: "true"
    source: /ssd/models/triton
    type: disk