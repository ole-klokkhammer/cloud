name: surveillance
description: Surveillance LXC - camera ingest, recording, playback API (CPU-only, unprivileged)
config:
  user.host: core
  limits.cpu: "2"
  limits.memory: 4GB
  security.nesting: "true"
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
devices:
  gpu:
    type: gpu
    gputype: physical
    id: nvidia.com/gpu=0
  config:
    path: /config
    shift: "true"
    source: /ssd/appdata/surveillance
    type: disk
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  media:
    path: /media
    shift: "true"
    source: /hdd/surveillance
    type: disk
  zot-env:
    path: /env/zot.env
    source: /ssd/appdata/env/zot.env
    shift: "true" 
    type: disk
  surveillance-env:
    path: /env
    source: /ssd/appdata/env/surveillance
    shift: "true" 
    type: disk
  models:
    path: /models
    shift: "true"
    source: /ssd/models/surveillance
    type: disk
  root:
    path: /
    pool: zpool
    type: disk
used_by: []
project: default
