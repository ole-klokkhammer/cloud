name: cloud
description: Cloud profile
config:
  limits.memory: 64GB
  # Hard cap, no swap: guest OOM (restarts one pod) is the scheduler; swapped
  # KV pages / frigate stalls are both worse. Pod-level Memory= owns sizing.
  limits.memory.swap: "false"
  security.nesting: "true"
  security.privileged: "false"
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
devices:
  # VERIFY the id is the 5060 Ti: triton + embedder expect the surveillance
  # GPU (see podman/triton). If gpu=0 is the 5090 (llm LXC), switch this id.
  gpu:
    type: gpu
    gputype: physical
    id: nvidia.com/gpu=0
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:ce:84:dc
  root:
    path: /
    pool: zpool
    type: disk
  podman_store:
    path: /ssd/podman
    source: /ssd/podman
    shift: "true"
    type: disk
  models:
    path: /ssd/models
    shift: "true"
    source: /ssd/models
    type: disk
  env:
    path: /ssd/appdata/env
    source: /ssd/appdata/env
    shift: "true"
    type: disk
  appdata_traefik:
    path: /ssd/appdata/traefik
    source: /ssd/appdata/traefik
    shift: "true"
    type: disk
  appdata_matrix:
    path: /ssd/appdata/matrix
    shift: "true"
    source: /ssd/appdata/matrix
    type: disk
  appdata_portainer:
    path: /ssd/appdata/portainer
    shift: "true"
    source: /ssd/appdata/portainer
    type: disk
  # --- surveillance service layout (mirrors the old surveillance-LXC mount
  # names so the moved quadlets under podman/ keep their /config, /env and
  # /models paths unchanged; data stays at the same host locations) ---
  surv_config:
    path: /config
    source: /ssd/appdata/surveillance
    shift: "true"
    type: disk
  surv_env:
    path: /env
    source: /ssd/appdata/env/surveillance
    shift: "true"
    type: disk
  surv_models:
    path: /models
    source: /ssd/models/surveillance
    shift: "true"
    type: disk
project: default
