name: cloud
description: Cloud profile
config:
  limits.memory: 64GB
  limits.memory.swap: "false"
  security.nesting: "true"
  security.privileged: "false"
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
devices:
  gpu:
    type: gpu
    gputype: physical
    id: nvidia.com/gpu=0
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:ce:84:dc
  root:
    path: /
    pool: zpool
    type: disk
  podman_store:
    path: /ssd/podman
    source: /ssd/podman
    shift: "true"
    type: disk
  models:
    path: /ssd/models
    shift: "true"
    source: /ssd/models
    type: disk
  env:
    path: /ssd/appdata/env
    source: /ssd/appdata/env
    shift: "true"
    type: disk
  appdata_traefik:
    path: /ssd/appdata/traefik
    source: /ssd/appdata/traefik
    shift: "true"
    type: disk
  appdata_matrix:
    path: /ssd/appdata/matrix
    shift: "true"
    source: /ssd/appdata/matrix
    type: disk
  appdata_surveillance:
    path: /ssd/appdata/surveillance
    source: /ssd/appdata/surveillance
    shift: "true"
    type: disk

project: default
