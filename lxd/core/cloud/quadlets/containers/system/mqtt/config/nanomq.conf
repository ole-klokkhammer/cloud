# NanoMQ 0.25 broker configuration for the fleet MQTT service (service name: mqtt).
# Loaded by `nanomq start --conf /etc/nanomq.conf`; on the host this is
# /ssd/appdata/mqtt/config/nanomq.conf, bind-mounted read-only as a single file.
#
# Keys follow the config the image ships at /etc/nanomq.conf and the config pages
# for the pinned version. NanoMQ refuses keys it does not recognise, so options
# are copied from the docs of that version rather than guessed.

# MQTT listener. Only this one, on apps.network: the container publishes nothing
# and traefik exposes 1883. TLS is off - clients come from the LAN and through
# traefik, which terminates nothing for raw MQTT.
listeners.tcp {
    bind = "0.0.0.0:1883"
}

# No listeners.ws: nothing in the fleet speaks MQTT over WebSocket and traefik
# does not route 8083. Add it back if a browser client shows up.

mqtt {
    property_size = 32
    max_topic_alias = 1024
    max_packet_size = 256MB
    max_mqueue_len = 2048
    retry_interval = 10s
    keepalive_multiplier = 1.25
}

# Retained messages and QoS 1/2 session state go to SQLite so they survive a
# restart. This is why the image is the -slim one: the basic image is built
# without SQLite and loses both on every restart.
#
# flush_mem_threshold is how many messages accumulate in memory before a flush
# reaches the database, so anything below it is lost on a restart. Keep it low:
# at 100 a lone retained discovery message could sit unwritten for days, and
# this broker's traffic is sparse. Writes are cheap here (SQLite on ZFS,
# recordsize 4k). The sqlite section is reloadable, so `nanomq reload` applies
# a change without a restart.
sqlite {
    disk_cache_size = 102400
    mounted_file_path = "/var/lib/nanomq/"
    flush_mem_threshold = 10
    resend_interval = 5000
}

# HTTP API, published by traefik at http://mqtt.cloud.core.homelan. There is no
# web UI behind it: NanoMQ ships none, so use the v4 GET endpoints (api/v4/brokers,
# /clients, /subscriptions, /metrics) rather than /, which is a 404.
#
# auth_type basic, not jwt: jwt needs a build with -DENABLE_JWT=ON and a public key
# file the image does not ship.
#
# The password is a placeholder on purpose. NanoMQ 0.25.7 reads credentials from
# this file only - its config parser has no getenv at all, so the
# NANOMQ_HTTP_SERVER_* variables in the website Docker page are dead here. The unit
# instead renders this file (mounted as /etc/nanomq.tpl) with sed, substituting
# NANOMQ_API_PASSWORD from /ssd/appdata/env/nanomq.env, and starts from the result
# in /tmp. So the real password lives in one 0600 file on the instance and reaches
# neither git nor disk. See mqtt.container for the command.
#
# username and password must both be present: the parser replaces the pair in a
# single call, so setting one and not the other is undefined. Keep the password free
# of | & and \ - sed uses | as its delimiter. Avoid $ and backtick too.
http_server {
    port = 8081
    ip_addr = "0.0.0.0"
    limit_conn = 32
    max_body = 65535
    auth_type = "basic"
}

# Journal only. The root filesystem is read-only and systemd captures stdout, so
# there is no point keeping a log file.
#
# info during bring-up: at warn the journal shows nothing about the MQTT listener,
# client connects or subscriptions, so 1883 is only provable from a client. Drop
# back to warn once the clients are repointed and quiet. `log` is one of the
# reloadable sections, so `podman exec mqtt nanomq reload --conf /tmp/nanomq.conf` applies it.
log {
    to = [console]
    level = info
}

# Open broker, same as the previous mosquitto setup (allow_anonymous true):
# anyone on apps.network, and anyone who can reach traefik's 1883, may publish
# and subscribe without credentials. The dashboard login above is separate and
# does not gate MQTT. Tightening this means setting allow_anonymous false and
# including auth { password = {include "/etc/nanomq_pwd.conf"} } plus an acl
# file, which then need their own single-file binds.
auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore
}
