# MQTT broker behind traefik. See ../../../mqtt/ (core:mqtt) for the broker itself.
#
# MQTT (tcp/1883) here is raw TCP, not HTTP, so it needs a tcp router on its own
# entrypoint: --entrypoints.mqtt.address=:1883 in traefik.container, with traefik
# publishing 1883 (the broker publishes nothing and traefik holds the well-known port
# on this address). The rule has to be HostSNI(`*`) - that is the only form a non-TLS
# tcp router accepts.
#
# The upstream is the broker instance's LAN address, not a container name: mosquitto
# runs natively on core:mqtt, so there is no apps.network DNS name to use. Both
# instances are on br0, so traefik reaches it directly. If core:mqtt ever gets a
# different address, this line and the clients that name the broker by IP are the two
# places to change - prefer a DNS name here if the LAN DNS gets one for it.
#
# There is no HTTP route for the broker any more. The previous broker exposed an HTTP
# API at http://mqtt.cloud.core.homelan; mosquitto 2.x has no HTTP server at all, so
# that host 404s and the router is gone rather than pointed at a dead port. Broker state
# comes from journald (`make logs`) and the Mosquitto control topics under
# $SYS/broker/... instead.
tcp:
  routers:
    mqtt:
      rule: "HostSNI(`*`)"
      entrypoints: [ mqtt ]
      service: mqtt
  services:
    mqtt:
      loadBalancer:
        servers:
          - address: "192.168.10.244:1883"
