# HTTP app behind traefik: opencode's web UI and its OpenAPI server are the same
# process on :4096, so one URL serves both. Unlike the mqtt router, this one is
# real HTTP on the web entrypoint and the upstream is a container DNS name, not
# an IP - opencode joins apps.network, exactly like matrix above.
#
# Authentication is opencode's own HTTP basic auth (OPENCODE_SERVER_USERNAME /
# OPENCODE_SERVER_PASSWORD from /ssd/appdata/env/opencode.env, read by the
# container through EnvironmentFile=). It is deliberately not duplicated here as
# a basicauth middleware: two independent password files for one service is how
# one of them goes stale. If this ever moves behind websecure, add TLS there and
# leave the credential check where it is.
#
# The UI keeps one long-lived SSE stream open per client (/global/event and the
# per-session event stream). Traefik streams by default; if a phone ever shows
# session output that only updates in bursts, the lever is
# providers.file -> http -> serversTransport -> responseForwarding.flushInterval
# on the service side, not a timeout change here.
#
# Reachability: opencode.cloud.core.homelan lives in the pfSense local zone, so
# it resolves for the WireGuard/pfSense side only. opencode.linole.org is public:
# TLS MUST terminate in front (pfSense HAProxy with an ACME cert, Send Host
# preserved) — the basic auth credential must never cross a plain-HTTP WAN hop.
# Consider the exposure: this is a shell-capable agent; WireGuard-only is the
# safer default if "public" was not a hard requirement.
http:
  routers:
    opencode:
      rule: "Host(`opencode.cloud.core.homelan`) || Host(`opencode.linole.org`)"
      entrypoints: [ web ]        # TLS-terminated public traffic arrives here from HAProxy
      service: opencode
  services:
    opencode:
      loadBalancer:
        servers:
          - url: "http://opencode:4096"
