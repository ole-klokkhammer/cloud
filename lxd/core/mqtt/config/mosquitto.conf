# Mosquitto 2.0 broker configuration for the fleet MQTT service (instance: core:mqtt).
#
# The Makefile here pushes this to /ssd/appdata/mqtt/config/mosquitto.conf, and
# systemd/fleet.conf points the unit's ExecStart at that path. It lives on the appdata
# dataset rather than /etc so that a recreated instance comes back with the same config
# and the file is inside sanoid's snapshots of ssd/appdata.
#
# The deb's own /etc/mosquitto/mosquitto.conf is deliberately unused: it sets no
# listener, and mosquitto 2.x then binds loopback only and refuses anonymous clients -
# which reads as a healthy service (`systemctl status` is green) that nobody can
# reach. That is the config the broker was running with before this file existed.
#
# Every option below is verified against the pinned version, not guessed: an
# unrecognised variable is fatal ("Unknown configuration variable", exit 3), which shows
# up as a crash loop under Restart=always rather than one clear failure. `tcp_nodelay` is
# one such - documented in newer releases, absent from 2.0.18 - so after an `apt
# upgrade`, check `make logs` before trusting a new option.

# --------------------------------------------------------------------------- listeners

# MQTT on the LAN. `listener 1883` without an address binds all families, but naming
# it explicitly keeps the intent obvious; traefik's tcp router and every device on the
# LAN reach the broker here.
listener 1883 0.0.0.0
protocol mqtt

# No websocket listener (9001): nothing in the fleet speaks MQTT over WebSocket and
# traefik routes no path to it. Add both lines back if a browser client shows up.
#
# listener 9001 0.0.0.0
# protocol websockets

# TLS is off - clients are on the LAN and behind traefik, which terminates nothing for
# raw MQTT. The deb has TLS built in, so a client that leaves the LAN needs a listener
# plus a certificate on this dataset:
#
# listener 8883 0.0.0.0
# certfile /ssd/appdata/mqtt/config/certs/mqtt.crt
# keyfile  /ssd/appdata/mqtt/config/certs/mqtt.key
# cafile   /ssd/appdata/mqtt/config/certs/ca.crt

# --------------------------------------------------------------------------- auth

# Open broker, as the fleet has always run it: anyone who can reach 1883 may publish
# and subscribe without credentials. Home LAN only; the route in from outside is
# traefik's published 1883. This does not gate who can read the topics.
allow_anonymous true

# To close it: set allow_anonymous false, uncomment the block below, create the two
# files on the dataset, and give every client credentials.
#
#   lxc exec core:mqtt -- mosquitto_passwd -c /ssd/appdata/mqtt/config/passwd <user>
#   lxc exec core:mqtt -- mosquitto_passwd -b /ssd/appdata/mqtt/config/passwd <user> <pass>
#
# per_listener_settings true
# password_file /ssd/appdata/mqtt/config/passwd
# acl_file /ssd/appdata/mqtt/config/acl

# ---------------------------------------------------------------------- persistence

# Retained messages and QoS 1/2 session state go to the dataset, so they survive a
# restart and a recreated instance. This is its own directory rather than the
# neighbouring data/: that one holds the old NanoMQ SQLite store and the dataset is
# mounted into core:cloud as well, where that broker still has it open.
#
# The file is mosquitto.db under persistence_location (trailing slash required).
persistence true
persistence_location /ssd/appdata/mqtt/mosquitto/

# Traffic here is sparse, so a lone retained discovery message must not sit unwritten
# for half an hour: autosave_on_changes makes autosave_interval count *changes*
# (subscriptions, retained messages, queued messages) instead of seconds. SIGUSR1,
# which `make save` sends, forces a write immediately.
autosave_interval 60
autosave_on_changes true

# ------------------------------------------------------------------------ limits

# Carried over from the previous broker's queue depth. The point of naming it is that a
# stalled subscriber is cut off at a known depth rather than growing the broker's
# memory; 2048 is generous for this fleet.
max_queued_messages 2048
max_inflight_messages 20

# Packet size stays at the default (no limit below the protocol maximum): payloads here
# are small JSON, and a limit would only ever surface as a client dropping its own
# connection. Set it if a client ever starts flooding:
#
# message_size_limit 1048576

# --------------------------------------------------------------------------- logging

# journald, like the other services here: no log directory to keep writable, and no
# ExecStartPre lines creating /var/log/mosquitto. There is no `log_dest journal` in
# this version - valid destinations are stdout, stderr, syslog, topic, file, dlt - so
# stderr, which is also what the broker defaults to, and journald captures it. Drop to
# `log_type warning` once the clients are repointed and quiet; `connection_messages
# true` is what makes each client id show up during the cutover.
log_dest stderr
log_timestamp false
connection_messages true
