# systemd drop-in for the mosquitto deb unit: /etc/systemd/system/mosquitto.service.d/fleet.conf
# (pushed by the Makefile here). The packaged unit under /usr/lib is left untouched -
# it had been edited in place on the instance, which `apt upgrade` would have silently
# reverted, so `make deploy` restores it and keeps every change in this file.
#
# After=network.target in the packaged unit is enough for a broker (it binds, no
# routing needed), but the dataset must be mounted before it starts or persistence
# silently goes to a root-owned /ssd/appdata/mqtt/mosquitto that mosquitto cannot open.

[Unit]
RequiresMountsFor=/ssd/appdata/mqtt

[Service]
# The packaged unit's own ExecStart - set when it was edited in place - points at
# /ssd/appdata/config/mosquitto.conf, which does not exist: the dataset is mounted at
# /ssd/appdata/mqtt. Clearing ExecStart here and setting it again means the broker runs
# with the config in git, whatever the packaged path says.
ExecStart=
ExecStart=/usr/sbin/mosquitto -c /ssd/appdata/mqtt/config/mosquitto.conf

# The packaged unit creates and chowns /var/log/mosquitto and /run/mosquitto before
# starting. Neither is needed here (config comes from the dataset, logging goes to
# stdout, no pid_file), and with User= set below they would run as mosquitto - which
# cannot chown, so the unit would fail before reaching ExecStart. Clear the list.
ExecStartPre=

# Run as the mosquitto user instead of letting the broker setuid itself from root, so
# the privilege drop does not need CAP_SETUID/CAP_SETGID. Port 1883 is privileged, hence
# the capability; the bounding set drops everything else.
User=mosquitto
Group=mosquitto
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE

LockPersonality=true
MemoryDenyWriteExecute=true
NoNewPrivileges=true
PrivateDevices=true
PrivateTmp=true
ProtectClock=true
ProtectControlGroups=true
ProtectHome=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
# strict keeps /etc read-only, which the broker never writes to: config comes from the
# dataset, and there is no log or pid file (logs go to stderr, journald captures them).
ProtectSystem=strict
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
# the only writable path: mosquitto.db under persistence_location
ReadWritePaths=/ssd/appdata/mqtt/mosquitto

Restart=always
RestartSec=5
TimeoutStopSec=15
