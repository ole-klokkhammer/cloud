name: plex
description: Plex container profile
config:
  limits.cpu: "4"
  limits.memory: 16GB
devices:
  config:
    path: /var/lib/plexmediaserver
    shift: "true"
    source: /ssd/appdata/plex
    type: disk
  eth0:
    hwaddr: 00:16:3e:03:f0:1b
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  gpu:
    gputype: physical
    id: nvidia.com/gpu=0
    type: gpu
  media:
    path: /hdd/media
    source: /hdd/media
    type: disk
  root:
    path: /
    pool: zpool
    type: disk
used_by:
  - /1.0/instances/plex
project: default
