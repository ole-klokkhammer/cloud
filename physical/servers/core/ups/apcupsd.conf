## apcupsd.conf v1.1 ##

UPSNAME apc
UPSCABLE usb
UPSTYPE usb

# Leave DEVICE blank — apcupsd auto-detects USB
DEVICE

POLLTIME 60

# Shutdown when battery drops below 5%
BATTERYLEVEL 5

# Shutdown when runtime remaining drops below 3 minutes
MINUTES 3

# Disable timeout-based shutdown (0 = off)
TIMEOUT 0

# How long to wait for UPS to return power before giving up and shutting down
ONBATTERYDELAY 30

NETSERVER on
NISIP 127.0.0.1
NISPORT 3551

EVENTSFILE /var/log/apcupsd.events
EVENTSFILEMAX 10

STATFILE /var/run/apcupsd/apcupsd.status
LOGSTATS off
STATTIME 0

DATATIME 0

UPSCLASS standalone
UPSMODE disable
