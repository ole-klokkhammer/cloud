#############################
# templates below this line #
#############################

[template_production]
        frequently = 0
        hourly = 0
        daily = 7
        weekly = 2
        monthly = 0
        yearly = 0
        autosnap = yes
        autoprune = yes
 

#############################
# datasets below this line  #
#############################

[ssd/appdata]
        use_template = template_production
        recursive           = yes
        script_timeout      = 7200
        post_snapshot_script = /usr/local/sanoid/scripts/post_snapshot.sh
        pruning_script       = /usr/local/sanoid/scripts/pruning_script.sh

[ssd/vm/homeassistant-zvol]
        use_template = template_production
        recursive           = no
        script_timeout      = 7200
        post_snapshot_script = /usr/local/sanoid/scripts/post_snapshot.sh
        pruning_script       = /usr/local/sanoid/scripts/pruning_script.sh