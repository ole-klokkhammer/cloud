name: hivemq
description: HiveMQ container profile
config:
  limits.cpu: "2"
  limits.memory: 32GB
  linux.kernel_modules: ip_tables, ip6_tables, netlink_diag, nf_nat, overlay
  raw.lxc: |
    lxc.apparmor.profile=unconfined
    lxc.cap.drop=
  security.nesting: "false"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0 
    type: nic
  root:
    path: /
    pool: zpool
    type: disk 
project: default


