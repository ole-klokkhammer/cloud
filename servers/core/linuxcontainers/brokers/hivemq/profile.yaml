name: hivemq
description: HiveMQ container profile
config:
  limits.cpu: "2"
  limits.memory: 32GB
  linux.kernel_modules: ip_tables, ip6_tables, netlink_diag, nf_nat, overlay
  raw.lxc: |
    lxc.apparmor.profile=unconfined
    lxc.cap.drop=
  security.nesting: "false"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:74:a9:8e
  root:
    path: /
    pool: zpool
    type: disk
  hivemq-data:
    type: disk
    path: /data
    source: /ssd/appdata/hivemq/data
    shift: "true"
  hivemq-extensions:
    path: /extensions
    source: /ssd/appdata/hivemq/extensions
    shift: "true"
  hivemq-config:
    type: disk
    path: /config
    source: /ssd/appdata/hivemq/config
    shift: "true"
project: default


