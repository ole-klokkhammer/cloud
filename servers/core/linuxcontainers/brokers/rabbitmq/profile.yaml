name: rabbitmq
description: RabbitMQ container profile
config:
  limits.cpu: "2"
  limits.memory: 32GB
  linux.kernel_modules: ip_tables, ip6_tables, netlink_diag, nf_nat, overlay
  raw.lxc: |
    lxc.apparmor.profile=unconfined
    lxc.cap.drop=
  security.nesting: "false"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0 
    type: nic
    hwaddr: 00:16:3e:8c:ff:60
  root:
    path: /
    pool: zpool
    type: disk
  rabbitmq-data:
    type: disk
    path: /var/lib/rabbitmq/mnesia
    source: /ssd/appdata/rabbitmq/mnesia
    shift: "true"
project: default