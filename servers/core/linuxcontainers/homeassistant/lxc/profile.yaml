name: homeassistant
description: homeassistant container profile
config:
  limits.cpu: "2"
  limits.memory: 4GB 
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:57:b5:7a
  homeassistant-config:
    path: /config
    shift: "true"
    source: /ssd/appdata/homeassistant/config
    type: disk
  secrets:
    path: /secrets/homeassistant.env
    source: /ssd/secrets/homeassistant.env
    type: disk
  root:
    path: /
    pool: zpool
    type: disk 
project: default
