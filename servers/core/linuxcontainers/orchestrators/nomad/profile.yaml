name: nomad
description: Nomad container profile
config:
  limits.cpu: "8"
  limits.memory: 64GB
  linux.kernel_modules: ip_tables, ip6_tables, netlink_diag, nf_nat, overlay
  raw.lxc: |
    lxc.apparmor.profile=unconfined
    lxc.cap.drop=
  security.nesting: "false"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:76:04:69
  root:
    path: /
    pool: zpool
    type: disk 
project: default


