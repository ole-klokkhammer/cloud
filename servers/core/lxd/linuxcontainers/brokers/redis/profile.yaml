name: redis
description: Redis container profile
config:
  limits.cpu: "2"
  limits.memory: 32GB
  security.nesting: "true"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  root:
    path: /
    pool: zpool
    type: disk
project: default


