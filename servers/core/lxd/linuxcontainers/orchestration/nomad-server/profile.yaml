name: nomad-server-1
description: Nomad Server container profile
config:
  limits.cpu: "2"
  limits.memory: 4GB
  security.nesting: "false"
  security.privileged: "false"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:76:04:69
  nomad-data:
    path: /opt/nomad/data
    shift: "true"
    source: /ssd/appdata/nomad-server/data
    type: disk
  root:
    path: /
    pool: zpool
    type: disk 
project: default